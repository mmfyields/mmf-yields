name: Scrape Vanguard yields
on:
  schedule:
    - cron: "20 22,23,0,1,2,4 * * *"   # UTC; evening/night ET. Script no-ops on weekends/holidays/when current.
  workflow_dispatch:
permissions:
  contents: write
concurrency: scrape
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install holidays
      - id: check
        run: python scraper/scrape.py --check
      - if: steps.check.outputs.need == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python scraper/scrape.py
      - if: always()
        run: |
          git config user.name "yield-bot"; git config user.email "yield-bot@users.noreply.github.com"
          git add docs/data/yields.csv
          git diff --cached --quiet || (git commit -m "Update yields $(date -u +%F)" && git pull --rebase && git push)
