name: Scrape money market yields
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min; scrape.py decides per fund whether a new value is due (cheap no-op otherwise)
  workflow_dispatch:
permissions:
  contents: write
concurrency: scrape
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install holidays
      - id: check
        run: python scraper/scrape.py --check
      - if: steps.check.outputs.need == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python scraper/scrape.py ${{ github.event_name == 'workflow_dispatch' && '--all' || '' }}
      - if: always()
        run: |
          git config user.name "yield-bot"; git config user.email "yield-bot@users.noreply.github.com"
          git add docs/data/yields.csv
          if [ -f logs/poll_log.csv ]; then git add logs/poll_log.csv; fi
          git diff --cached --quiet || (git commit -m "Update yields $(date -u +%F)" && git pull --rebase && git push)
