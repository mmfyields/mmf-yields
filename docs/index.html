<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money market 7-day SEC yields</title>
<style>
:root{--bg:#eef2f5;--ink:#14212b;--mute:#5d6b76;--card:#fff;--line:#d5dde3;--a:#14212b;--ok:#1f7a3d;--warn:#b26a00;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.05rem;margin:28px 0 10px}
.sub{color:var(--mute);margin:0 0 8px}
.funds{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:repeat(2,max-content);gap:6px 40px}
.funds li{display:flex;align-items:center;gap:8px;white-space:nowrap}
@media (max-width:720px){.funds{grid-template-columns:1fr}}
@media (max-width:480px){.funds li{white-space:normal}}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
#quality{display:flex;gap:12px;align-items:flex-start}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none;background:var(--mute)}
#quality b{display:block}#quality span{color:var(--mute);font-size:.9rem}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
button{font:inherit;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 12px;cursor:pointer}
button[aria-pressed=true]{background:var(--a);color:#fff;border-color:var(--a)}
button:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.chartbox{position:relative;height:340px}
.tablewrap{max-height:380px;overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;background:var(--card)}
th,td{padding:6px 12px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:#f6f8fa}
form{display:flex;flex-wrap:wrap;gap:12px;align-items:end}label{display:grid;gap:2px;font-size:.85rem;color:var(--mute)}
input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px}
.msg{color:var(--mute);margin:8px 0}
.tax{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;margin:0 0 12px;padding:8px 14px}
.tax label{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:.95rem}
.tax input[type=number]{width:4.5rem;padding:3px 6px}
.tax .more{margin-left:auto;border:0;background:none;color:var(--a);padding:2px 4px;font-size:.9rem}
.tax .more:hover{text-decoration:underline}
.tax .msg{flex-basis:100%;margin:2px 0 0;font-size:.85rem}
caption{text-align:left;padding:6px 12px;color:var(--mute);font-size:.85rem}
#legtip{position:fixed;z-index:10;display:none;max-width:280px;padding:4px 8px;border-radius:4px;background:var(--ink);color:#fff;font-size:.8rem;pointer-events:none}
</style></head><body><main>
<h1>Money market 7-day SEC yields</h1>
<p class="sub">7-day SEC yields, collected daily from each fund company's site:</p>
<ul class="funds" id="funds"></ul>
<div class="card" id="quality"><div class="dot" id="dot"></div><div><b id="qhead">Loading…</b><span id="qdetail"></span></div></div>

<h2>Yield history</h2>
<div class="bar" id="ranges" role="group" aria-label="Date range"></div>
<div class="card tax">
<label><input type="checkbox" id="taxon"> Show taxable-equivalent yields</label>
<label>Federal rate <input type="number" id="fed" min="0" max="60" step="0.1" inputmode="decimal" placeholder="24" title="Federal marginal tax rate (%)">%</label>
<label>State rate <input type="number" id="st" min="0" max="60" step="0.1" inputmode="decimal" placeholder="5" title="State marginal tax rate (%)">%</label>
<button type="button" class="more" id="taxmore" aria-expanded="false" aria-controls="taxnote">Details ▾</button>
<p class="msg" id="taxnote" hidden></p>
</div>
<div class="card"><div class="chartbox"><canvas id="chart" aria-label="Yield chart" role="img"></canvas></div></div>
<div class="tablewrap"><table id="tbl"></table></div>

<h2>Look up a date range</h2>
<div class="card">
<form id="form">
<label>From<input type="date" id="from" required></label>
<label>To<input type="date" id="to" required></label>
<button type="submit">Show yields</button>
</form>
<p class="msg" id="cmsg"></p>
<div class="tablewrap" id="cwrap" hidden><table id="ctbl"></table></div>
</div>
</main>
<div id="legtip" role="tooltip"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const FUNDS=["VMFXX","VUSXX","VMSXX","TTTXX"],COLORS={VMFXX:"#96151d",VUSXX:"#3d9a3d",VMSXX:"#3b4cb8",TTTXX:"#0d4a1f"};
const NAMES={VMFXX:"Vanguard Federal Money Market Fund",VUSXX:"Vanguard Treasury Money Market Fund",VMSXX:"Vanguard Municipal Money Market Fund",TTTXX:"BlackRock Treasury Trust Fund"};
const RANGES=[["1M","1 month"],["6M","6 months"],["YTD","Year to date"],["1Y","1 year"],["5Y","5 years"],["MAX","Max"]];
const $=id=>document.getElementById(id);
const iso=d=>d.toISOString().slice(0,10);
const utc=s=>new Date(s+"T00:00:00Z");
const todayS=(()=>{const n=new Date();return iso(new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())))})();
let byDate={},dates=[],chart;
$("funds").innerHTML=FUNDS.map(f=>`<li><span class="sw" style="background:${COLORS[f]}"></span><span>${NAMES[f]} (<b>${f}</b>)</span></li>`).join("");
const TAXKEY={VUSXX:"s",TTTXX:"s",VMSXX:"f"}; // rate whose tax advantage the fund has; VMFXX is the taxable baseline
const tax={on:false,f:0,s:0,open:false};let cur="1M";
const rate=v=>{const x=parseFloat(v);return isNaN(x)?0:Math.min(60,Math.max(0,x))};
function adj(f,v){if(!tax.on||v==null)return v;const k=TAXKEY[f];return k?v/(1-(k==="f"?tax.f:tax.s)/100):v}
function taxNote(){$("taxnote").textContent=tax.on?"VMFXX is shown as reported. VUSXX and TTTXX = yield ÷ (1 − state rate). VMSXX (assumed out-of-state) = yield ÷ (1 − federal rate). Rates apply to all dates. Estimates only, not tax advice.":"Enter your marginal tax rates and turn this on to compare the funds on a taxable-equivalent basis. If the 3.8% net investment income tax applies to you, include it in your federal rate."}
function setTaxOpen(o){tax.open=o;$("taxnote").hidden=!o;$("taxmore").setAttribute("aria-expanded",o);$("taxmore").textContent=o?"Hide details ▴":"Details ▾"}
function saveTax(){try{localStorage.setItem("mmf-tax",JSON.stringify(tax))}catch(e){}}
function taxChanged(){tax.on=$("taxon").checked;tax.f=rate($("fed").value);tax.s=rate($("st").value);taxNote();saveTax();render(cur);if(!$("cwrap").hidden)lookup()}
function initTax(){
  try{Object.assign(tax,JSON.parse(localStorage.getItem("mmf-tax")||"{}"))}catch(e){}
  tax.on=!!tax.on;tax.open=!!tax.open;tax.f=rate(tax.f);tax.s=rate(tax.s);
  $("taxon").checked=tax.on;$("fed").value=tax.f||"";$("st").value=tax.s||"";taxNote();
  setTaxOpen(tax.open);
  $("taxmore").addEventListener("click",()=>{setTaxOpen(!tax.open);saveTax()});
  $("taxon").addEventListener("change",taxChanged);
  ["fed","st"].forEach(id=>$(id).addEventListener("input",()=>{if($(id).value!=="")$("taxon").checked=true;taxChanged()}));
}
const hidden=new Set(); // funds hidden via the legend; persists across range changes
const tipEl=$("legtip");
function showTip(ev,t){tipEl.textContent=t;tipEl.style.display="block";tipEl.style.left=Math.max(4,Math.min(ev.clientX+12,innerWidth-tipEl.offsetWidth-8))+"px";tipEl.style.top=(ev.clientY+16)+"px"}
function hideTip(){tipEl.style.display="none"}

function shift(s,{m=0,y=0}){const d=utc(s);d.setUTCMonth(d.getUTCMonth()-m);d.setUTCFullYear(d.getUTCFullYear()-y);return iso(d)}
function bounds(k){
  const e=todayS;
  return [k==="1M"?shift(e,{m:1}):k==="6M"?shift(e,{m:6}):k==="YTD"?e.slice(0,4)+"-01-01":k==="1Y"?shift(e,{y:1}):k==="5Y"?shift(e,{y:5}):(dates[0]||e),e];
}
function weekdaysBetween(a,b){let n=0;for(let d=utc(a);;){d.setUTCDate(d.getUTCDate()+1);if(iso(d)>b)break;if(d.getUTCDay()%6)n++}return n}
function inRange(a,b){return dates.filter(d=>d>=a&&d<=b)}
function fmt(v){return v==null?"–":v.toFixed(2)+"%"}
function tableHTML(ds){
  return (tax.on?"<caption>Taxable-equivalent yields</caption>":"")+"<thead><tr><th>Date</th>"+FUNDS.map(f=>`<th title="${NAMES[f]}">${f}</th>`).join("")+"</tr></thead><tbody>"+
    ds.slice().reverse().map(d=>`<tr><td>${d}</td>${FUNDS.map(f=>`<td>${fmt(adj(f,byDate[d][f]))}</td>`).join("")}</tr>`).join("")+"</tbody>";
}
function render(k){
  cur=k;
  [...$("ranges").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));
  const [a,b]=bounds(k),ds=inRange(a,b);
  hideTip();if(chart)chart.destroy();
  chart=new Chart($("chart"),{type:"line",data:{labels:ds,datasets:FUNDS.map(f=>({label:f,hidden:hidden.has(f),borderColor:COLORS[f],backgroundColor:COLORS[f],borderWidth:2,pointRadius:ds.length>90?0:3,spanGaps:true,tension:.15,data:ds.map(d=>adj(f,byDate[d][f])??null)}))},
    options:{maintainAspectRatio:false,interaction:{mode:"index",intersect:false},scales:{y:{title:{display:true,text:tax.on?"Taxable-equivalent yield (%)":"7-day SEC yield (%)"},ticks:{callback:v=>v.toFixed(2)}},x:{ticks:{maxTicksLimit:8}}},plugins:{legend:{onClick:(e,item,legend)=>{const c=legend.chart,i=item.datasetIndex,vis=c.isDatasetVisible(i);c.setDatasetVisibility(i,!vis);vis?hidden.add(item.text):hidden.delete(item.text);c.update()},onHover:(e,item)=>{if(e.native)showTip(e.native,NAMES[item.text]||item.text)},onLeave:hideTip},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.parsed.y)}`}}}}});
  $("tbl").innerHTML=ds.length?tableHTML(ds):"<tbody><tr><td>No data in this range yet.</td></tr></tbody>";
}
function quality(){
  const dot=$("dot");
  if(!dates.length){dot.style.background="var(--bad)";$("qhead").textContent="No data yet";$("qdetail").textContent="Run the “Scrape money market yields” workflow to collect the first values.";return}
  const last=dates[dates.length-1],lag=weekdaysBetween(last,todayS);
  const fl={};FUNDS.forEach(f=>{fl[f]=dates.filter(d=>byDate[d][f]!=null).pop()||null});
  const behind=FUNDS.filter(f=>fl[f]!==last);
  const stalled=behind.filter(f=>!fl[f]||weekdaysBetween(fl[f],last)>1);
  const waiting=behind.filter(f=>!stalled.includes(f));
  let c,t;
  if(lag<=1){c="--ok";t="Up to date"}else if(lag<=4){c="--warn";t="Possibly delayed (holiday or a missed run)"}else{c="--bad";t="Stale (the scraper may be failing)"}
  if(stalled.length&&c==="--ok")c="--warn";
  dot.style.background=`var(${c})`;$("qhead").textContent=t+": latest value as of "+last;
  const missing=weekdaysBetween(dates[0],last)-(dates.length-1);
  let note="";
  if(waiting.length)note+=` Waiting on the ${last} value for ${waiting.join(", ")}; fund pages update at different times of day, so this usually clears within hours.`;
  if(stalled.length)note+=` Possibly stale: ${stalled.map(f=>`${f} (latest value ${fl[f]?"as of "+fl[f]:"none yet"})`).join(", ")}.`;
  $("qdetail").textContent=`Data covers ${dates[0]} to ${last} (${dates.length} days). ${missing>0?missing+" weekday(s) in this span have no data (market holidays or missed runs).":"No gaps."}${note}`;
}
function init(txt){
  txt.trim().split("\n").slice(1).forEach(l=>{const [d,f,y]=l.split(",");if(!d)return;(byDate[d]??={})[f]=parseFloat(y)});
  dates=Object.keys(byDate).sort();
  RANGES.forEach(([k,label])=>{const b=document.createElement("button");b.textContent=label;b.dataset.k=k;b.onclick=()=>render(k);$("ranges").append(b)});
  initTax();quality();render("1M");
  if(dates.length){$("from").value=dates[Math.max(0,dates.length-10)];$("to").value=dates[dates.length-1]}
}
function lookup(){
  const a=$("from").value,b=$("to").value;
  if(a>b){$("cmsg").textContent="The start date must be on or before the end date.";$("cwrap").hidden=true;return}
  const ds=inRange(a,b);
  $("cmsg").textContent=ds.length?`${ds.length} day(s) with data between ${a} and ${b}.`:`No data between ${a} and ${b}.`+(dates.length?` Available: ${dates[0]} to ${dates[dates.length-1]}.`:"");
  $("cwrap").hidden=!ds.length;$("ctbl").innerHTML=ds.length?tableHTML(ds):"";
}
$("form").onsubmit=e=>{e.preventDefault();lookup()};
fetch("data/yields.csv",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(init)
  .catch(()=>{$("qhead").textContent="Couldn't load data/yields.csv"});
</script></body></html>
